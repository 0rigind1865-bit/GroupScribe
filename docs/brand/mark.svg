<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 群記：一隻安靜的貓頭鷹。六個形狀，縮到 16px 仍認得出來。 -->
  <rect width="256" height="256" rx="56" fill="#059669"/>
  <!-- 耳羽 -->
  <path d="M72 96 L86 56 L112 92 Z" fill="#d1fae5"/>
  <path d="M184 96 L170 56 L144 92 Z" fill="#d1fae5"/>
  <!-- 臉 -->
  <circle cx="128" cy="140" r="76" fill="#d1fae5"/>
  <!-- 眼睛：半閉＝安靜在聽 -->
  <path d="M84 138 q20 18 40 0" stroke="#064e3b" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M132 138 q20 18 40 0" stroke="#064e3b" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- 喙 -->
  <path d="M118 160 L138 160 L128 178 Z" fill="#f59e0b"/>
</svg>
